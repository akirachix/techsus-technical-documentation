site_name: Techsus Technical Documentation

theme:
  name: material
  logo: assets/images/redu_icon.png
  favicon: assets/images/redu_icon.png
  palette:
    - scheme: default
      primary: white
      accent: light blue
  font:
    text: Nunito
    code: Fira Mono
  features:
    - navigation.sections
    - navigation.instant
    - navigation.expand
    - toc.integrate
    - search.highlight
    - search.suggest
    - search.share

extra_css:
  - styles/extra.css

nav:
  - Home: index.md
  - Product:
      - Overview: overview.md
      - How It Works: how-it-works.md
      - Features: features.md
  - Design:
      - Architecture: architecture.md
      - Data Model: data-model.md
      - Brand Guideline: brand-guideline.md
  - Engineering:
      - Frontend (PWA): frontend.md
      - Backend & Database: backend.md
      - AI Tutor: ai-tutor.md
  - Quality & Security:
      - Security & Compliance: security.md
      - QA Process: qa-process.md
  - Operations:
      - Getting Started: getting-started.md
      - Code Standards: code-standards.md
      - Deployment & DevOps: deployment-process.md

markdown_extensions:
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.superfences