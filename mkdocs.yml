site_name: Techsus Technical Documentation

theme:
  name: material
  logo: assets/images/redu_icon.png
  favicon: assets/images/redu_icon.png
  palette:
    - scheme: default
      primary: white
      accent: blue
  font:
    text: Nunito
    code: Fira Mono
  features:
    - navigation.instant
    - navigation.top
    - toc.follow
    - content.code.copy
    - navigation.sections
    - navigation.expand
    - search.highlight
    - search.suggest
    - search.share
    - navigation.footer

extra:
  generator: false

extra_css:
  - styles/extra.css

nav:
  - Home: index.md
  - How It Works: how-it-works.md
  - Features: features.md
  - Architecture: architecture.md
  - Brand Guideline: brand-guideline.md
  - Frontend (PWA): frontend.md
  - Backend & Database: backend.md
  - Security & Compliance: security.md
  - QA Process: qa-process.md
  - Code Standards: code-standards.md
  - Deployment & DevOps: deployment-process.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.superfences
